name: Completar La condena y verificar biblioteca

on:
  push:
    branches: ['import/platon-maquiavelo-kafka']
    paths: ['.github/workflows/reintentar-condena.yml']

jobs:
  condena:
    name: La condena
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/platon-maquiavelo-kafka
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar, validar y subir EPUB oficial SEP
        env:
          BOOK_ID: kafkacondenasep01
          TITLE: La condena
          AUTHOR: Franz Kafka
          SOURCE_URL: https://bdchamakes.sep.gob.mx/nebulosas/1883_La_condena-SEP-.epub
          COVER_URL: https://commons.wikimedia.org/w/thumb.php?f=Self-portrait_of_Franz_Kafka.jpg&w=480
          CATEGORY: Literatura
          YEAR: '1912'
          DESCRIPTION: Relato sobre autoridad paterna, culpa, sumisión y absurdo trágico. EPUB de la Biblioteca Digital de la SEP; portada de catálogo con autorretrato de Franz Kafka de dominio público, Wikimedia Commons.
        run: bash scripts/importar-epub-sep.sh

  verificar:
    name: Verificar importación completa y tamaño
    needs: condena
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar los clásicos solicitados
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute biblioteca-logidma --remote --json --command="SELECT id,titulo,autor,formato,paginas,tamano,estado FROM libros WHERE id LIKE 'platonazc%' OR id IN ('maquiaveloprinsep01','kafkametamorfsep01','kafkaanteleysep01','kafkacondenasep01') ORDER BY autor,titulo;" > /tmp/catalogo.json
          cat /tmp/catalogo.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/catalogo.json'))
          rows=[]
          def walk(x):
              if isinstance(x, dict):
                  if {'id','titulo','autor','formato','estado'} <= x.keys(): rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(data)
          unique={r['id']:r for r in rows}
          assert len(unique)==15, f'Se esperaban 15 registros y se encontraron {len(unique)}: {sorted(unique)}'
          assert sum(1 for i in unique if i.startswith('platonazc'))==11
          assert all(r.get('estado')=='publicado' for r in unique.values())
          print('VERIFICADO: 11 Platón + El príncipe + 3 Kafka = 15 registros publicados')
          PY
      - name: Medir libros registrados en R2
        run: npx wrangler d1 execute biblioteca-logidma --remote --command="SELECT COUNT(*) AS libros_r2, SUM(tamano) AS bytes_registrados FROM libros WHERE almacen='r2' AND estado='publicado';"
