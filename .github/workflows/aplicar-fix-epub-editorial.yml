name: Aplicar y probar corrección EPUB editorial

on:
  push:
    branches: ['fix/epub-editorial']
    paths: ['.github/workflows/aplicar-fix-epub-editorial.yml']

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/epub-editorial

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar parche conservador
        run: python scripts/aplicar-fix-epub-editorial.py

      - run: npm ci
      - run: npm run vendor
      - run: npm install --no-save --package-lock=false jsdom@26.1.0

      - name: Descargar EPUB real de prueba
        run: curl --fail --location 'https://bdchamakes.sep.gob.mx/nebulosas/427aC_La_Republica-SEP-.epub' -o /tmp/republica.epub

      - name: Comprobar sintaxis
        run: |
          node --check public/js/formatos.js
          node --check public/js/epub-zip.js

      - name: Probar La República real
        run: node scripts/probar-epub-editorial.mjs /tmp/republica.epub

      - name: Guardar cambio probado en la rama
        run: |
          set -euo pipefail
          git config user.name 'Biblioteca GPT'
          git config user.email '108173876+DavisMtz@users.noreply.github.com'
          git add public/js/formatos.js public/css/lector.css
          git diff --cached --check
          git commit -m 'Corregir portada y maquetación editorial de EPUB'
          git push origin HEAD:fix/epub-editorial
