name: Reintentar Oráculo con control de rate limit

on:
  push:
    branches: ['import/platon-maquiavelo-kafka']
    paths:
      - '.github/workflows/reintentar-oraculo.yml'
      - 'scripts/importar-oraculo-wikisource.py'

jobs:
  oraculo:
    name: Oráculo manual y arte de prudencia
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/platon-maquiavelo-kafka
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar generador EPUB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install --quiet beautifulsoup4
      - name: Reconstruir 300 aforismos, validar y subir
        run: python scripts/importar-oraculo-wikisource.py
      - name: Verificar clásicos de estrategia
        shell: bash
        run: |
          npx wrangler d1 execute biblioteca-logidma --remote --json --command="SELECT id,titulo,autor,formato,tamano,estado FROM libros WHERE id IN ('suntzuarteguerrasep01','gracianoraculo1647','maquiaveloprinsep01') ORDER BY autor;" > /tmp/resultado.json
          cat /tmp/resultado.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/resultado.json'))
          rows=[]
          def walk(x):
              if isinstance(x,dict):
                  if {'id','titulo','estado'} <= x.keys(): rows.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          unique={r['id']:r for r in rows}
          expected={'suntzuarteguerrasep01','gracianoraculo1647','maquiaveloprinsep01'}
          assert set(unique)==expected, f'Faltan clásicos: {expected-set(unique)}'
          assert all(r['estado']=='publicado' for r in unique.values())
          print('VERIFICADO: Sun Tzu + Gracián + Maquiavelo están publicados')
          PY
