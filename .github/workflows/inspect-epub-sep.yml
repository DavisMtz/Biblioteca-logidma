name: Inspeccionar EPUB SEP

on:
  push:
    branches: ['inspect/epub-sep']
    paths: ['.github/workflows/inspect-epub-sep.yml']

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar EPUB
        run: curl --fail --location 'https://bdchamakes.sep.gob.mx/nebulosas/427aC_La_Republica-SEP-.epub' -o /tmp/libro.epub

      - name: Resumen estructural
        shell: python
        run: |
          import zipfile, re, xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          z=zipfile.ZipFile('/tmp/libro.epub')
          names=z.namelist()
          c=ET.fromstring(z.read('META-INF/container.xml'))
          opf_path=next(e.attrib.get('full-path') for e in c.iter() if e.tag.endswith('rootfile'))
          opf=ET.fromstring(z.read(opf_path))
          base=opf_path.rsplit('/',1)[0]+'/' if '/' in opf_path else ''
          manifest={}
          for e in opf.iter():
            if e.tag.endswith('item'):
              manifest[e.attrib.get('id')] = (base+e.attrib.get('href',''), e.attrib.get('media-type',''), e.attrib.get('properties',''))
          spine=[]
          for e in opf.iter():
            if e.tag.endswith('itemref'):
              it=manifest.get(e.attrib.get('idref'))
              if it: spine.append(it)
          print('SPINE COUNT', len(spine))
          title=z.read(spine[0][0]).decode('utf-8','replace')
          for tag in ('body','div','svg','image'):
            m=re.search(r'<'+tag+r'\b([^>]*)>', title, re.I)
            print('COVER', tag, m.group(1).strip() if m else 'MISSING')
          vals=defaultdict(Counter)
          for n in names:
            if not n.lower().endswith('.css'): continue
            txt=re.sub(r'/\*[\s\S]*?\*/',' ',z.read(n).decode('utf-8','replace'))
            for _,body in re.findall(r'([^{}]+)\{([^{}]*)\}', txt):
              for d in body.split(';'):
                if ':' not in d: continue
                p,v=d.split(':',1)
                p=p.strip().lower(); v=v.strip()
                if p in {'font-size','line-height','margin','margin-top','margin-bottom','text-indent','text-align','display','width','max-width','padding'}:
                  vals[p][v]+=1
          for p in sorted(vals): print('VALUES', p, vals[p].most_common(30))
