name: Identificar edición existente de Diálogos I

on:
  push:
    branches: ['import/platon-maquiavelo-kafka']
    paths: ['.github/workflows/identificar-dialogos-i.yml']

jobs:
  identificar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar Diálogos I desde R2
        run: npx wrangler r2 object get 'biblioteca-logidma/libros/f53e7b08ca6f4ceab654.pdf' --file=/tmp/dialogos-i.pdf --remote
      - name: Identificar edición
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo /tmp/dialogos-i.pdf | grep -E '^(Title|Author|Creator|Producer|Pages|File size):' || true
          pdftotext -f 1 -l 12 -layout /tmp/dialogos-i.pdf /tmp/inicio.txt || true
          grep -iEn -m 20 'gredos|azc.r|traduc|biblioteca cl.sica|editorial|introducci.n|apolog.a|eutifr.n|prot.goras' /tmp/inicio.txt || true
