name: Auditar catálogo vivo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-catalogo.yml'

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Exportar catálogo D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute biblioteca-logidma --remote --json \
            --command="SELECT id,titulo,autor,descripcion,categoria,anio,formato,clave_archivo,nombre_archivo,tamano,portada_url,paginas,estado,creado_en,actualizado_en,partes,tamano_parte,almacen FROM libros ORDER BY titulo COLLATE NOCASE;" \
            > catalogo-live.json

      - name: Guardar auditoría
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-live
          path: catalogo-live.json
          if-no-files-found: error
          retention-days: 1
