name: Importar La República de Platón

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/importar-republica.yml'

jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Descargar y verificar el EPUB oficial
        shell: bash
        run: |
          set -euo pipefail
          URL='https://bdchamakes.sep.gob.mx/nebulosas/427aC_La_Republica-SEP-.epub'
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o /tmp/la-republica-platon.epub
          test "$(unzip -p /tmp/la-republica-platon.epub mimetype)" = 'application/epub+zip'
          unzip -t /tmp/la-republica-platon.epub >/dev/null
          mkdir -p /tmp/republica-verificacion
          unzip -q /tmp/la-republica-platon.epub -d /tmp/republica-verificacion
          grep -RiqE 'Plat[oó]n' /tmp/republica-verificacion
          grep -RiqE 'La Rep[uú]blica|Rep[uú]blica' /tmp/republica-verificacion
          echo "EPUB verificado: $(stat -c %s /tmp/la-republica-platon.epub) bytes"

      - name: Subir EPUB a R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put 'biblioteca-logidma/libros/platonrepublicasep01.epub' \
            --file /tmp/la-republica-platon.epub \
            --remote \
            --content-type 'application/epub+zip' \
            --content-disposition 'inline; filename="La Republica - Platon.epub"'

      - name: Registrar el libro en D1
        shell: bash
        run: |
          set -euo pipefail
          TAMANO=$(stat -c %s /tmp/la-republica-platon.epub)
          AHORA=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > /tmp/republica.sql <<SQL
          INSERT INTO libros (
            id, titulo, autor, descripcion, categoria, anio, formato, clave_archivo,
            nombre_archivo, tamano, portada_url, paginas, estado, creado_en, actualizado_en,
            partes, tamano_parte, almacen
          ) VALUES (
            'platonrepublicasep01',
            'La República',
            'Platón',
            'Diálogo filosófico sobre la justicia, la organización de la ciudad, la educación y la naturaleza del alma. Edición EPUB de la Biblioteca Digital de la SEP; ISBN 978-607-643-036-1.',
            'Filosofía',
            NULL,
            'epub',
            'libros/platonrepublicasep01.epub',
            'La República - Platón.epub',
            ${TAMANO},
            'https://bdchamakes.sep.gob.mx/imgs/nebulosas/laRepublica.png',
            NULL,
            'publicado',
            '${AHORA}',
            '${AHORA}',
            1,
            5242880,
            'r2'
          )
          ON CONFLICT(id) DO UPDATE SET
            titulo=excluded.titulo,
            autor=excluded.autor,
            descripcion=excluded.descripcion,
            categoria=excluded.categoria,
            formato=excluded.formato,
            clave_archivo=excluded.clave_archivo,
            nombre_archivo=excluded.nombre_archivo,
            tamano=excluded.tamano,
            portada_url=excluded.portada_url,
            estado='publicado',
            actualizado_en=excluded.actualizado_en,
            partes=excluded.partes,
            tamano_parte=excluded.tamano_parte,
            almacen='r2';
          SQL
          npx wrangler d1 execute biblioteca-logidma --remote --file=/tmp/republica.sql

      - name: Comprobar registro en D1
        run: npx wrangler d1 execute biblioteca-logidma --remote --command="SELECT id,titulo,autor,formato,almacen,tamano,estado FROM libros WHERE id='platonrepublicasep01';"
