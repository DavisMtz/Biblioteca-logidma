<!doctype html>
<html lang="es" data-tema="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector · Biblioteca Logidma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icono-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="stylesheet" href="/css/estilo.css">
<link rel="stylesheet" href="/css/lector.css">
</head>
<body class="cuerpo-lector">

<header class="lector__barra" id="barra-superior">
  <a class="btn btn--texto" id="btn-biblioteca" href="/" aria-label="Volver al catálogo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 5 8 12l7 7"/>
    </svg>
    <span class="oculto-movil">Biblioteca</span>
  </a>

  <div class="lector__titulo">
    <strong id="titulo-libro">Cargando…</strong>
    <span id="autor-libro"></span>
  </div>

  <div class="lector__acciones">
    <!-- Los mismos dos botones sirven para las dos cosas: agrandan el texto
         cuando el libro refluye y acercan la página cuando es un PDF. -->
    <div class="grupo-tipo" role="group" aria-label="Tamaño de la lectura">
      <button class="btn btn--texto btn--sm" id="texto-menos" type="button" aria-label="Reducir">A−</button>
      <button class="btn btn--texto btn--sm" id="nivel-zoom" type="button" hidden
              aria-label="Ajustar la página a la pantalla">Ajustar</button>
      <button class="btn btn--texto btn--sm" id="texto-mas" type="button" aria-label="Agrandar">A+</button>
    </div>
    <button class="btn btn--icono btn--linea" id="btn-tema" type="button" data-ciclo="claro sepia oscuro"
            aria-label="Cambiar el tema de lectura">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <button class="btn btn--icono btn--linea" id="btn-compartir" type="button"
            aria-label="Compartir el enlace a este libro" title="Compartir este libro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/>
        <path d="m8.8 10.8 6.4-3.6M8.8 13.2l6.4 3.6"/>
      </svg>
    </button>
    <a class="btn btn--icono btn--linea" id="btn-descargar" href="#" download aria-label="Descargar el archivo original" title="Descargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>
      </svg>
    </a>
  </div>
</header>

<main class="lector" id="lector">
  <button class="paso paso--izq" id="anterior" type="button" aria-label="Página anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>

  <div class="hoja" id="hoja">
    <div class="hoja__cargando" id="cargando">
      <div class="progreso"><span id="progreso-barra"></span></div>
      <p id="progreso-texto">Abriendo el libro…</p>
    </div>
    <div class="hoja__flujo" id="flujo" hidden></div>

    <!-- Caja gemela e invisible: aquí se cuenta cuántas páginas ocupa cada
         bloque sin sacarlo a la pantalla. Tiene que medir exactamente lo
         mismo que la de al lado, o el reparto no cuadraría al montarlo. -->
    <div class="hoja__flujo hoja__medidor" id="medidor" hidden aria-hidden="true"></div>

    <!-- La zona del PDF se desplaza sola: al acercar, la página crece más que
         la hoja y hay que poder recorrerla. -->
    <div class="hoja__pdf" id="zona-pdf" hidden>
      <div class="pdf__pagina" id="pdf-pagina">
        <canvas class="hoja__lienzo" id="lienzo"></canvas>
        <div class="pdf__texto" id="pdf-texto"></div>
      </div>
    </div>
  </div>

  <button class="paso paso--der" id="siguiente" type="button" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>
</main>

<footer class="lector__pie">
  <button class="btn btn--sm btn--linea oculto-escritorio" id="anterior-movil" type="button">Anterior</button>
  <label class="visualmente-oculto" for="deslizador">Ir a una página</label>
  <input class="deslizador" id="deslizador" type="range" min="1" max="1" value="1" step="1">
  <button class="lector__cuenta" id="cuenta" type="button" title="Ir a una página">— / —</button>
  <label class="visualmente-oculto" for="ir-pagina">Número de página</label>
  <input class="lector__ir" id="ir-pagina" type="number" min="1" step="1" hidden>
  <span class="visualmente-oculto" id="anuncio" aria-live="polite"></span>
  <button class="btn btn--sm btn--linea oculto-escritorio" id="siguiente-movil" type="button">Siguiente</button>
</footer>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/js/comun.js"></script>
<script src="/js/epub-zip.js"></script>
<script src="/js/pwa.js" defer></script>
<script src="/js/formatos.js"></script>
<script type="module" src="/js/lector.js"></script>
</body>
</html>
